[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttauto-pipeline"
version = "0.2.0"
description = "Exact modular proofs from spectral supersets and train-track automata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.scripts]
ttauto = "ttauto_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["ttauto_pipeline*", "ttauto_cert*"]
